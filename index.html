<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>또콩의 건강한생활</title>
<style>
  :root { --bg:#F3F4EE; --text:#1D221B; --sub:#5B6457; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131611; --text:#E8ECE4; --sub:#A3AC9E; } }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); display: grid; place-items: center;
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; padding: 24px 16px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--sub); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>또콩의 건강한생활</h1>
  <p>큰 목표를 세우고, 매주 할 일로 쌓아 가는 습관 기록 앱</p>
</main>
</body>
</html>
